<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>龜龜心理測驗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 首頁 -->
    <div id="start-page" class="page active">
        <h1>你是哪種龜龜？</h1>
        <p>16型龜龜測驗 超準 不準是你的問題</p>
        <button id="start-btn">開始</button>
    </div>

    <!-- 測驗頁 -->
    <div id="quiz-page" class="page">
        <!-- 測驗進度條 -->
        <div class="progress-wrapper" style="margin-bottom: 25px;">
            <div id="progress-text" style="text-align: right; font-size: 13px; color: #8e8e93; margin-bottom: 6px; font-weight: bold;">1 / 8</div>
            <div class="progress-container" style="margin-bottom: 0;">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
        </div>

        <!-- 雙欄排版容器 -->
        <div class="quiz-container">
            <!-- 題目圖片區域 -->
            <div class="quiz-media">
                <img id="question-img" class="quiz-img" src="" alt="題目圖片" style="display: none;">
            </div>
            
            <!-- 題目與選項區域 -->
            <div class="quiz-content">
                <p id="question-text">題目載入中...</p>
                <div id="options-container">
                    <!-- 選項會透過 JS 產生 -->
                </div>
            </div>
        </div>

        <!-- 回到上一題按鈕 -->
        <div style="text-align: center;">
            <button id="back-btn" class="back-btn" style="display: none;">回到上一題</button>
        </div>
    </div>

    <!-- 結果頁 -->
    <div id="result-page" class="page">
        <h2>你的測驗結果是：</h2>
        
        <!-- 結果圖片區域 -->
        <img id="result-img" class="quiz-img" src="" alt="結果圖片" style="display:none;">
        
        <h1 id="result-title">結果計算中...</h1>
        <p id="result-desc">敘述載入中...</p>
        <p id="result-advice" style="margin-top: 20px; padding: 15px; background: #f5f5f7; border-radius: 10px; font-weight: bold; color: #04682c;"></p>
        
        <!-- 結果屬性百分比進度條 -->
        <div id="result-bars" class="result-bars-container">
            <div class="result-bar-group">
                <div class="result-bar-label">
                    <span>67值</span>
                    <span id="x-percent-text">0%</span>
                </div>
                <div class="progress-container">
                    <div id="x-bar" class="progress-fill x-fill"></div>
                </div>
            </div>
            <div class="result-bar-group">
                <div class="result-bar-label">
                    <span>叛逆值</span>
                    <span id="y-percent-text">0%</span>
                </div>
                <div class="progress-container">
                    <div id="y-bar" class="progress-fill y-fill"></div>
                </div>
            </div>
        </div>
        
        <button id="restart-btn">再測一次</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
